<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Danksgiving</title>
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Danksgiving">
<meta name="theme-color" content="#14100c" media="(prefers-color-scheme: dark)">
<meta name="theme-color" content="#f6efe4" media="(prefers-color-scheme: light)">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="apple-touch-icon-180.png">
<link rel="apple-touch-icon" sizes="512x512" href="apple-touch-icon.png">
<link rel="icon" type="image/png" href="apple-touch-icon-180.png">
<style>
  :root { --bg: #f6efe4; --card: #fffcf7; --ink: #2a1d14; --muted: #6d5c4c; --accent: #b9481a; --line: #e4d8c6; }
  @media (prefers-color-scheme: dark) { :root { --bg: #14100c; --card: #201913; --ink: #f6eee3; --muted: #b8a996; --accent: #f08a4b; --line: #3a3027; } }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; background: var(--bg); color: var(--ink); font: 17px/1.45 system-ui, -apple-system, "Segoe UI", sans-serif; }
  /* App mode: the app fills the screen between the status bar and the home indicator. */
  #frameWrap { position: fixed; inset: 0; padding: env(safe-area-inset-top) 0 env(safe-area-inset-bottom); background: var(--bg); display: none; }
  #frameWrap iframe { width: 100%; height: 100%; border: 0; display: block; background: var(--bg); }
  #loading { position: absolute; inset: 0; display: grid; place-items: center; pointer-events: none; }
  #loading img { width: 88px; height: 88px; border-radius: 20px; opacity: .9; animation: pulse 1.4s ease-in-out infinite; }
  @keyframes pulse { 50% { transform: scale(.94); opacity: .6; } }
  body.app #frameWrap { display: block; }
  body.app #intro { display: none; }
  /* Intro mode: how to add it to the home screen. */
  #intro { min-height: 100%; display: grid; place-items: center; padding: calc(24px + env(safe-area-inset-top)) 16px 24px; }
  main { max-width: 420px; width: 100%; text-align: center; }
  main img { width: 120px; height: 120px; border-radius: 27px; box-shadow: 0 10px 30px rgba(60, 30, 10, .25); }
  h1 { font-family: Georgia, serif; font-size: 32px; margin: 18px 0 6px; }
  p { color: var(--muted); margin: 0 0 18px; }
  ol { text-align: left; background: var(--card); border: 1px solid var(--line); border-radius: 16px; padding: 14px 16px 14px 36px; margin: 0 0 18px; }
  li { margin: 6px 0; }
  a.btn { display: block; padding: 15px; border-radius: 14px; background: var(--accent); color: #fff; font-weight: 700; text-decoration: none; }
  .small { font-size: 14px; margin-top: 14px; }
</style>
</head>
<body>
<div id="intro">
  <main>
    <img src="apple-touch-icon-180.png" alt="">
    <h1>Danksgiving</h1>
    <p>The prep plan, day-of timeline, recipes, and shopping list.</p>
    <ol>
      <li>In Safari, tap <b>Share</b>.</li>
      <li>Tap <b>Add to Home Screen</b>, then <b>Add</b>.</li>
      <li>Open Danksgiving from the turkey icon and enter the crew passcode.</li>
    </ol>
    <a class="btn" href="?go=1">Open Danksgiving</a>
    <p class="small">On a computer, bookmark this page after opening it.</p>
  </main>
</div>
<div id="frameWrap"><div id="loading"><img src="apple-touch-icon-180.png" alt=""></div></div>
<script>
  // The app lives on Google Apps Script, which cannot set an iPhone home screen icon or run full screen
  // on its own. This page carries the icon and shows the app inside itself. Opened plainly it explains
  // how to add it; the address it leaves behind (?go=1) is what the home screen saves.
  var APP = 'https://script.google.com/macros/s/AKfycbzIlDS36afrwXaT4qxweWF0xH96h4f12xStK5H5QlQtTSGpnow78BAFqNpuzxX2jygW/exec';

  function get(k) { try { return localStorage.getItem('dg_' + k) || ''; } catch (e) { return ''; } }
  function put(k, v) { try { if (v) localStorage.setItem('dg_' + k, v); } catch (e) {} }

  // The app reports its passcode and name so they survive the app frame's storage being cleared.
  window.addEventListener('message', function (e) {
    if (!/^https:\/\/[a-z0-9-]+\.googleusercontent\.com$/.test(e.origin) && e.origin !== 'https://script.google.com') return;
    var d = e.data && e.data.dg;
    if (!d) return;
    put('k', d.k); put('me', d.me);
  });

  // Invite links look like ?join=K7PQ4QX9&me=Sam&from=Evan. A home screen app does not share storage
  // with Safari, so the code and name also ride along in the address the home screen saves.
  var P = new URLSearchParams(location.search.slice(1) + '&' + location.hash.slice(1));
  var joinCode = P.get('join') || P.get('k'), joinMe = P.get('me'), joinFrom = P.get('from');
  if (joinCode) put('k', joinCode);
  if (joinMe) put('me', joinMe);
  if (P.get('join')) {
    var h = document.querySelector('#intro h1'), p = document.querySelector('#intro main p');
    h.textContent = joinMe ? 'Welcome, ' + joinMe : 'You are invited';
    p.textContent = (joinFrom ? joinFrom + ' invited you to the Danksgiving crew.' : 'You are invited to the Danksgiving crew.') +
      ' Add it to your home screen so it is one tap away.';
    var lastStep = document.querySelector('#intro ol li:last-child');
    if (lastStep) lastStep.innerHTML = 'Open Danksgiving from the turkey icon. Your invite is built in.';
  }

  if (/[?&]go=1\b/.test(location.search)) {
    document.body.classList.add('app');
    var q = [], k = get('k'), me = get('me');
    if (k) q.push('k=' + encodeURIComponent(k));
    if (me) q.push('me=' + encodeURIComponent(me));
    var f = document.createElement('iframe');
    f.src = APP + (q.length ? '?' + q.join('&') : '');
    f.title = 'Danksgiving';
    f.allow = 'clipboard-write';
    f.onload = function () { var l = document.getElementById('loading'); if (l) l.remove(); };
    document.getElementById('frameWrap').appendChild(f);
  } else {
    var keep = ['go=1'];
    if (joinCode) keep.push('k=' + encodeURIComponent(joinCode));
    if (joinMe) keep.push('me=' + encodeURIComponent(joinMe));
    try { history.replaceState(null, '', location.pathname + '?' + keep.join('&')); } catch (e) {}
    var openBtn = document.querySelector('#intro a.btn');
    if (openBtn) openBtn.setAttribute('href', '?' + keep.join('&'));
  }
</script>
</body>
</html>
